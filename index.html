<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logica-programacion-2 </title>
    <!-- ============== Boostrap ============== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles/styles.css">
</head>

<body>
    <div>
        <div class="cardGrados" id="cardGrados">
            <div class="card-body">
                <form id="formGradoCelsius">
                    <div class="">
                        <label for="validationCustom01" class="form-label">Ingresa la temperatura en grados
                            Celsius</label>
                        <input type="number" id="inputGradoCelsius" name="gradoCelsius" class="form-control" required>
                    </div>
                    <br>
                    <div class="col-12">
                        <button type="submit" id="btnConvertir" class="btnDiseno">Convertir 🌡️</button>
                    </div>
                </form>
                <br>
                <!-- ============== Resultados ============== -->
                <h4 class="card-title">RESULTADO</h4>
                <div class="">
                    <label for="disabledTextInput" class="form-label">Grados Kelvin</label>
                    <input type="number" id="resultKelvin" class="form-control" disabled="true">
                </div>
                <div class="">
                    <label for="disabledTextInput" class="form-label">Grados Fahrenheit</label>
                    <input type="number" id="resultFahrenheit" class="form-control" disabled="true">
                </div>
            </div>
        </div>


    </div>

    <!-- ============== Boostrap ============== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>

</body>

</html>
